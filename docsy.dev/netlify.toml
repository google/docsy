# Hugo build configuration for Netlify
# (https://gohugo.io/host-and-deploy/host-on-netlify/#configure-hugo-version-in-netlify)

# base = "docsy.dev" - set via web UI

[build]
publish = "docsy.dev/public"
command = "npm run _netlify:prepare && npm run -C docsy.dev build:preview"

[build.environment]
GO_VERSION = "1.25.5"
# Netlify clones into a dir named "repo"; the theme lives in repo's theme/ subdir.
HUGO_THEME = "repo/theme"
# Constrain Netlify's automatic npm install to resolution only: no tree
# writes, no bin linking. The build command installs from the lock via
# install:safe. Netlify offers no way to skip this install, so if NPM_FLAGS
# ever stops being honored, the install runs for real: strict-allow-scripts
# (.npmrc) still gates its scripts, and the is:clean bracket in
# _netlify:prepare flags its tree writes.
NPM_FLAGS = "--dry-run --ignore-scripts"

[context.production]
command = "npm run _netlify:prepare && npm run -C docsy.dev build:production"

[context.doc-rooted.environment]
TD_BUILD_CTX = "doc-rooted"

# Redirects for slug swap: /docs/adding-content/ → /docs/content/
[[redirects]]
  from = "/docs/adding-content/content"
  to = "/docs/content/adding-content"
  status = 301

[[redirects]]
  from = "/docs/adding-content/*"
  to = "/docs/content/:splat"
  status = 301

# cSpell:ignore docsy
