# Details, see docs/content/adding-content.md § Doc-rooted sites
permalinks:
  page:
    docs: /:sections[1:]/:slug/
  section:
    docs: /:sections[1:]

cascade:
  - build: { render: link }
    target: { path: / }
  # Keep in step with _default's section outputs (tests/hugo-build/doc-rooted-outputs).
  - outputs: [HTML, RSS, print, markdown, LLMS]
    target: { path: /docs }
