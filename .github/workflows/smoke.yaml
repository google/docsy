# Smoke test across OSs: build a Docsy-based site from scratch,
# using Docsy as hugo module and fetching Docsy via NPM.

name: smoke

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  new-site:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        docsy-src: [NPM, HUGO_MODULE]
    env:
      BASE_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
      PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      SHA: ${{ github.sha }}
    # TODO: drop PR testing under Windows because it's too slow?
    # if: github.event_name != 'pull_request' && matrix.os != 'windows-latest'
    if: github.event_name != 'push' || github.repository == 'google/docsy'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # The checkout's only runtime role here: provide the repo's pinned
      # Hugo (node_modules/.bin/hugo), which make-site.sh borrows. Docsy
      # itself reaches the scaffolded sites from GitHub (per matrix leg).
      - name: Install the repo toolchain
        run: npm run install:safe
        shell: bash

      - name: 'Sanity check: install left the working tree pristine'
        run: npm run -s is:clean

      # Outside the repo tree: npm run PATH-walks ancestor
      # node_modules/.bin dirs, so an in-repo scaffold could silently
      # borrow the repo's sass (the false-clean the consumer legs catch).
      - name: Create the site scaffold directory
        run: mkdir -p "$RUNNER_TEMP/docsy-smoke" && cd "$RUNNER_TEMP/docsy-smoke" && npm init -y
        shell: bash

      - name: Make site (non-PR)
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/docsy-smoke
        run: |
          "$GITHUB_WORKSPACE/scripts/make-site.sh" -s ${{ matrix.docsy-src }} -r $BASE_REPO -v $SHA
        shell: bash

      - name: Make site from PR
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/docsy-smoke
        run: |
          "$GITHUB_WORKSPACE/scripts/make-site.sh" -s ${{ matrix.docsy-src }} -r $PR_REPO -v $BRANCH
        shell: bash

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tmp-site-${{ matrix.os }}-${{ matrix.docsy-src }}
          path: |
            ${{ runner.temp }}/docsy-smoke
            !**/node_modules
            !**/resources
